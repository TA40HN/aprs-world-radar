; APRS World Radar: ESP32 + 1.3" ST7789 display showing live APRS stations and aircraft around you.
;   pio run -e esp32dev                 build the firmware
;   pio run -e esp32dev -t upload       flash it over USB
;   pio run -e sim && .pio/build/sim/program   render every screen to sim/out/*.png on the host (needs SDL2 headers)
;   node scripts/release.mjs [--out DIR]       release build + web-flasher manifest + one merged .bin

[platformio]
default_envs = esp32dev

[common]
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.2

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 3 MB app, ~900 KB LittleFS for drive trails. No OTA: updates go through the browser flasher or USB.
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
lib_deps =
  ${common.lib_deps}
  mikalhart/TinyGPSPlus@^1.1.0
build_flags =
  -Wall


; The image published on aprs.world/radar: never picks up include/secrets.h. Built by scripts/release.mjs.
[env:release]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DRELEASE_BUILD

[env:sim]
platform = native
lib_deps = ${common.lib_deps}
lib_compat_mode = off
build_flags =
  -std=gnu++17
  -O1
  -DSIM
  -lSDL2
build_src_filter = +<ui.cpp> +<i18n.cpp> +<../sim/*.cpp>
